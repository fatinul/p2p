name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: p2p
            asset: p2p_linux_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: p2p
            asset: p2p_linux_aarch64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: p2p
            asset: p2p_linux_aarch64_musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: p2p.exe
            asset: p2p_windows_x86_64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: p2p.exe
            asset: p2p_windows_aarch64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: p2p
            asset: p2p_macos_x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            bin: p2p
            asset: p2p_macos_aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The runner is already aarch64, so no cross-compiler is needed.
      # musl-gcc compiles the bundled SQLite C code against musl headers
      # (a glibc compiler emits open64/stat64/__memcpy_chk, which musl lacks).
      - name: Install musl toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_musl=ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Bumped so the old glibc-compiled libsqlite3-sys output isn't reused
          key: v2-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ ! -f "$src" ]; then
            echo "::error::Binary not found: $src"
            echo "Contents of release directory:"
            ls -la "target/${{ matrix.target }}/release"
            exit 1
          fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"
          echo "Prepared release assets:"
          ls -la dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}